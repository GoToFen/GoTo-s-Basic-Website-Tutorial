<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tutorial</title>

    <style>
        div:not(#out, #in) {
            width: fit-content;
            height: fit-content;
            margin: auto;

            background-color: #ffffff00;
            border: 15px solid #c5a801;
            border-radius: 8px;
            border-style: dashed;

            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
            font-size: x-large;
            text-align: center;
            color: gray;
        }

        #out {
            width: fit-content;
            height: fit-content;
            margin: auto;

            display: flex;
            align-items: center;

            background-color: #111111;
            border-radius: 8px;
        }

        #in {
            background-color: white;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div id="out">
        <div>
            <div id="in">
                PAGE UNDER<br>
                DEVELOPMENT!
            </div>
        </div>
    </div>
</body>
</html>
