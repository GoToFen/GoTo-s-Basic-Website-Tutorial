<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        body {
            background-color: #dddddd;
        }
        table {
            background-color: #ffffff;
            border-spacing: 10px 10px;
            border-radius: 10px;
        }

        .t-left {
            width: 100px;
        }
        .t-right {
            width: 200px;
        }
        .t-content {
            width: 100%;
        }
        .t-text {
            width: 95%
        }

        form div {
            margin: auto;
            width: 300px;
        }

        form div label {
            font-family: Arial, Helvetica, sans-serif;
            font-size: larger;
        }
        form div button {
            font-family: Arial, Helvetica, sans-serif;
            font-size: large;

            background-color: #04AA6D;
            color: #ffffff;
            border: 2px solid #04AA6D;
            border-radius: 5px;
        }
        form div button:hover {
            background-color: gray;
            color: black;
            border: 2px solid gray;
            cursor: pointer;
        }
        form div input {
            font-family: Arial, Helvetica, sans-serif;
            font-size: medium;

            border-radius: 5px;
            border: 2px solid #aaaaaa;
            background-color: #dddddd;
        }
    </style>
</head>
<body>
    <form action="home.html" method="get">
        <div>
            <table>
                <tr>
                    <td class="t-left"><label for="uname">Username:</label></td>
                    <td class="t-right"><input class="t-text"
                        type="text"
                        id="uname"
                        name="uname"
                        maxlength="18"
                        placeholder="Enter Username"
                        required></td>
                </tr>
                <!--
                <tr>
                    <td class="t-left"><label for="pass">Password:</label></td>
                    <td class="t-right"><input class="t-text"
                        type="password"
                        id="pass"
                        name="pass"
                        maxlength="18"
                        placeholder="Enter Password"
                        required></td>
                </tr>
                -->
                <tr>
                    <td class="t-right" colspan="2"><button class="t-content" type="submit">Login</button></td>
                </tr>
            </table>
        </div>
    </form>
</body>
</html>
